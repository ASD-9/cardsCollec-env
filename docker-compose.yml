services:
  cc-mysql:
    image: mysql:9.2
    container_name: cardsCollec-db
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - 3306:3306
    volumes:
      - cardsCollec-dbdata:/var/lib/mysql
    restart: unless-stopped
    networks:
      - default
      - pma_network

  cc-node:
    image: akuan09/cards-collec:latest
    container_name: cardsCollec-node
    depends_on:
      - cc-mysql
    ports:
      - 12000:3000
    environment:
      DB_HOST: ${MYSQL_HOST}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PORT: ${NODE_PORT}
    restart: unless-stopped

volumes:
  cardsCollec-dbdata:

networks:
  default:
  pma_network:
    external: true
